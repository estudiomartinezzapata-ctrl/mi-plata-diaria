</style></head><body><main class="wrap"><header><h1>Mi Plata Diaria</h1><div class="sub" id="subtitle"></div></header><div id="install" class="notice hidden">Abrila desde Safari → Compartir → Añadir a pantalla de inicio. Hacé respaldos frecuentes: los datos quedan en este dispositivo.</div><div id="setup" class="card hidden"><h2 id="setupTitle">Configurá tu período</h2><form id="periodForm"><label>Sueldo ($)</label><input id="salary" inputmode="decimal" required placeholder="1.000.000"><label>Inicio del período (día que cobraste)</label><input id="start" type="date" required><label>Próximo cobro</label><input id="payday" type="date" required><p class="sub">Los fijos se gestionan desde la pestaña Fijos y se descuentan según su vencimiento.</p><button style="width:100%">Guardar período</button></form></div><div id="content"></div></main><button class="fab hidden" id="fab">+ Cargar gasto</button><nav class="nav hidden" id="nav"></nav><dialog id="sheet"><div class="sheethead"><h2 id="sheetTitle">Cargar gasto</h2><button id="closeSheet" type="button">✕</button></div><div id="sheetBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script>

// Migración conservadora: se preservan los campos originales de cada período.

let state=initial(),tab='inicio',viewMonth=month(today()),selectedDay=null,expanded=false,includeEstimate=false,scenarioAmount=20000,undo=null;try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);state=validate(migrate(parsed));if(parsed.version===1){localStorage.setItem(KEY+'-respaldo-original-v1',raw);localStorage.setItem(KEY,JSON.stringify(state));}}}catch(e){alert('No se pudieron leer los datos anteriores. No se borraron. Detalle: '+e.message)}

const expenses=p=>p?.expenses||[],spent=(p,d)=>round(expenses(p).filter(e=>e.date===d).reduce((a,e)=>a+e.amount,0)),planned=p=>state.planned.filter(q=>q.date>=p.start&&q.date<p.payday),plannedTotal=p=>round(planned(p).reduce((a,q)=>a+q.amount,0));

tado actualizado')});for(const [attr,list] of [['del-fixed',ensureMonth(viewMonth)],['del-template',state.template],['del-legacy',state.legacyFixed],['del-plan',state.planned]])document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>{if(!confirm('¿Borrar este registro?'))return;const i=list.findIndex(x=>x.id===b.dataset[attr.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]);if(i<0)return;const item=list.splice(i,1)[0];commit('Registro borrado');toast('Registro borrado',()=>{list.splice(i,0,item);commit('Registro restaurado')})});document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>planSheet(b.dataset.editPlan));document.querySelectorAll('[data-convert]').forEach(b=>b.onclick=()=>{const q=state.planned.find(x=>x.id===b.dataset.convert);expenseSheet(null,q.date,q.id)});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const a=state.archive[+b.dataset.archive];sheet('Período archivado',`<p>${label(a.start)} – ${label(a.payday)}</p><p>Sueldo ${fmt(a.salary)} · Gastos variables ${fmt(a.expenses.reduce((v,e)=>v+e.amount,0))}</p>${a.expenses.map(e=>`<div class="row">${label(e.date)} · ${esc(e.category||'Gasto')} <b>${fmt(e.amount)}</b></div>`).join('')}`,()=>{})});$('estimate')?.addEventListener('change',e=>{state.settings.estimate=e.target.checked;commit('Ajuste guardado')});$('weighted')?.addEventListener('change',e=>{state.settings.weighted=e.target.checked;commit('Ajuste guardado')});document.querySelectorAll('[data-weight]').forEach(el=>el.onchange=()=>{const v=Number(el.value);if(!(v>=.1&&v<=10))return alert('Usá un peso entre 0,1 y 10');state.settings.weights[+el.dataset.weight]=v;commit('Peso guardado')});$('suggestWeights')?.addEventListener('click',()=>{const p=pNow(),means=Array.from({length:7},(_,i)=>{const ds=[...new Set(expenses(p).map(e=>e.date))].filter(d=>week(d)===i);return ds.length?ds.reduce((a,d)=>a+spent(p,d),0)/ds.length:0}),avg=means.reduce((a,v)=>a+v,0)/7||1;state.settings.weights=means.map(v=>Math.max(.1,round(v/avg)));commit('Pesos sugeridos')});$('scenarioInput')?.addEventListener('input',e=>{const v=moneyParse(e.target.value);if(!Number.isFinite(v)||v<0)return;scenarioAmount=v;$('scenarioResult').innerHTML=scenarioCard('Tu escenario',scenario(pNow(),v))});$('copyBtn')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(backup());toast('Respaldo copiado')}catch(e){$('pasteBackup').value=backup();toast('Copiá el texto del cuadro')}});$('exportBtn')?.addEventListener('click',async()=>{const file=new File([backup()],`mi-plata-diaria-${today()}.json`,{type:'application/json'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Respaldo Mi Plata Diaria'});return}}catch(e){if(e.name==='AbortError')return}toast('Usá Copiar respaldo como alternativa')});$('importFile')?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(f){if(f.size>5000000)return alert('Archivo demasiado grande');restore(await f.text())}});$('restoreText')?.addEventListener('click',()=>restore($('pasteBackup').value))}

const iconSvg='<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#14835b"/><text x="90" y="121" font-size="105" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">$</text></svg>';const iconUrl='data:image/svg+xml,'+encodeURIComponent(iconSvg);$('touchIcon').href=iconUrl;$('manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'Mi Plata Diaria',short_name:'Mi Plata',start_url:'.',display:'standalone',background_color:'#f2f2f7',theme_color:'#14835b',icons:[{src:iconUrl,sizes:'180x180',type:'image/svg+xml'}]}));
render();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pNow())render()});
